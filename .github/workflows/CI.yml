name: CI
on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly: new CRDS contexts can bring rule features not evaluated here
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{matrix.version}} - ${{matrix.os}} - ${{matrix.arch}} - ${{github.event_name}}
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "min"
          - "1"
          - "pre"
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - 'default'
    env:
      # the live comparisons with the CRDS servers run in one job only, to spare the servers
      CRDSCLIENT_SKIP_ONLINE: ${{ (matrix.os == 'ubuntu-latest' && matrix.version == '1') && '0' || '1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{matrix.version}}
          arch: ${{matrix.arch}}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          test_args: '--verbose'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
